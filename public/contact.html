<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TikTok Downloader</title>
    <style>
        :root {
            /* 메인 페이지와 동일한 라이트 쿨그레이 테마 */
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-sub: #6b7280;
            --border-color: #e5e7eb;
            --accent-color: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-color);
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        h1 { font-size: 1.8rem; color: var(--text-main); border-bottom: 2px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px; }
        p { color: var(--text-sub); font-size: 1rem; margin-bottom: 16px; }
        .contact-card {
            background: #f9fafb;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 16px;
            margin-top: 20px;
        }
        .email-link {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }
        footer { margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px; text-align: center; color: var(--text-sub); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>
        <h1>Contact Us</h1>
        
        <p>If you have any questions, suggestions, or technical inquiries regarding our service, please reach out to us via email.</p>

        <div class="contact-card">
            <p style="margin-bottom: 8px;"><strong style="color: var(--text-main);">Support Email:</strong></p>
            <a href="mailto:bongjaeum@gmail.com" class="email-link">bongjaeum@gmail.com</a>
        </div>

        <footer>
            <p>&copy; TikTok Downloader. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
