<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokDownloader - 틱톡 & 인스타그램 릴스 다운로더</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 2.5rem; border-radius: 20px; width: 100%; max-width: 500px; text-align: center; }
        h1 { margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; }
        .input-group { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
        button { padding: 12px 20px; border-radius: 10px; border: none; background: #6366f1; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #4f46e5; }
        .result-box { display: none; margin-top: 1.5rem; padding: 1.5rem; background: #0f172a; border-radius: 12px; }
        .video-title { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 1rem; word-break: break-all; }
        .download-btn { display: block; width: 100%; padding: 12px 0; background: #10b981; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; text-align: center; }
        .download-btn:hover { background: #059669; }
        #loading { display: none; color: #818cf8; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TokDownloader</h1>
        <p class="subtitle">워터마크 없는 TikTok 및 Instagram Reels 다운로드</p>

        <div class="input-group">
            <input type="text" id="tiktok-url" placeholder="TikTok 또는 Instagram Reels 링크를 입력하세요">
            <button onclick="downloadVideo()">분석</button>
        </div>

        <div id="loading">영상을 분석하고 있습니다...</div>

        <div class="result-box" id="result-box">
            <div class="video-title" id="video-title"></div>
            <a href="#" id="dl-link" class="download-btn">동영상 다운로드</a>
        </div>
    </div>

    <script>
        function extractShortcode(url) {
            const match = url.match(/(?:reels?|p|tv)\/([A-Za-z0-9_-]+)/);
            return match ? match[1] : null;
        }

        // 인스타그램 전용: 사용자 브라우저 IP 이용 우회 파싱
        async function parseInstaInBrowser(url) {
            const shortcode = extractShortcode(url);
            if (!shortcode) throw new Error('올바른 인스타그램 릴스 링크가 아닙니다.');

            const targetUrl = `https://www.instagram.com/p/${shortcode}/embed/captioned/`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
            
            const res = await fetch(proxyUrl);
            const data = await res.json();
            const html = data.contents;

            let videoUrl = '';
            const match = html.match(/"video_url":"([^"]+)"/);
            if (match && match[1]) {
                videoUrl = JSON.parse(`"${match[1]}"`);
            } else {
                const ogMatch = html.match(/<meta property="og:video" content="([^"]+)"/);
                if (ogMatch && ogMatch[1]) {
                    videoUrl = ogMatch[1].replace(/&amp;/g, '&');
                }
            }

            if (!videoUrl) throw new Error('영상을 추출할 수 없습니다. (비공개 계정 여부 확인)');
            return videoUrl;
        }

        async function downloadVideo() {
            const urlInput = document.getElementById('tiktok-url').value.trim();
            const resultBox = document.getElementById('result-box');
            const loading = document.getElementById('loading');
            
            if (!urlInput) {
                alert('링크를 입력해주세요.');
                return;
            }

            resultBox.style.display = 'none';
            loading.style.display = 'block';

            try {
                let videoUrl = '';
                let title = '';

                // 1. 인스타그램 링크 처리
                if (urlInput.includes('instagram.com')) {
                    videoUrl = await parseInstaInBrowser(urlInput);
                    title = 'Instagram Reel';
                } 
                // 2. 틱톡 링크 처리 (기존 틱톡 로직 100% 동일 유지)
                else {
                    const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                    const result = await response.json();

                    if (result && result.data && result.data.play) {
                        videoUrl = result.data.play;
                        if (!videoUrl.startsWith('http')) {
                            videoUrl = 'https://www.tikwm.com' + videoUrl;
                        }
                        title = result.data.title || 'TikTok Video';
                    } else {
                        throw new Error('틱톡 분석 실패');
                    }
                }

                loading.style.display = 'none';

                document.getElementById('video-title').innerText = title;
                const dlBtn = document.getElementById('dl-link');
                
                // 스트림 라우트로 전달하여 다운로드
                dlBtn.href = `/api/stream?videoUrl=${encodeURIComponent(videoUrl)}`;
                resultBox.style.display = 'block';

            } catch (err) {
                loading.style.display = 'none';
                alert(err.message || '영상을 분석할 수 없습니다.');
            }
        }
    </script>
</body>
</html>
