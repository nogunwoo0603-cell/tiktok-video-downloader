<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f0f0f; color: #fff; margin: 0; padding: 16px; }
        .card { background: #1f1f1f; padding: 28px 24px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center; border: 1px solid #2f2f2f; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .tabs { display: flex; margin-bottom: 24px; gap: 8px; background: #121212; padding: 6px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: transparent; color: #888; font-weight: bold; font-size: 15px; cursor: pointer; }
        .tab-btn.active { background: #0095f6; color: #fff; }
        h2 { margin: 0 0 16px 0; font-size: 20px; }
        input { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 10px; border: 1px solid #3f3f3f; background: #121212; color: #fff; font-size: 14px; outline: none; }
        button.action-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #0095f6; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.action-btn:disabled { background: #444; cursor: not-allowed; }
        #status { margin-top: 16px; font-size: 14px; color: #aaa; word-break: break-all; }
        .direct-link { display: inline-block; margin-top: 12px; padding: 10px 16px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" id="tiktokTab" onclick="switchPlatform('tiktok')">TikTok</button>
            <button class="tab-btn" id="instaTab" onclick="switchPlatform('insta')">Instagram</button>
        </div>

        <h2 id="title">TikTok Downloader</h2>
        <input type="text" id="urlInput" placeholder="Paste TikTok link here...">
        <button class="action-btn" id="downloadBtn" onclick="processDownload()">Download Video</button>
        <div id="status"></div>
    </div>

    <script>
        let currentPlatform = 'tiktok';

        function switchPlatform(platform) {
            currentPlatform = platform;
            const tiktokTab = document.getElementById('tiktokTab');
            const instaTab = document.getElementById('instaTab');
            const title = document.getElementById('title');
            const input = document.getElementById('urlInput');
            const status = document.getElementById('status');

            status.innerHTML = '';

            if (platform === 'tiktok') {
                tiktokTab.classList.add('active');
                instaTab.classList.remove('active');
                title.innerText = 'TikTok Downloader';
                input.placeholder = 'Paste TikTok link here...';
            } else {
                instaTab.classList.add('active');
                tiktokTab.classList.remove('active');
                title.innerText = 'Instagram Reels Downloader';
                input.placeholder = 'Paste Instagram Reels link here...';
            }
        }

        async function processDownload() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');

            if (!url) return alert('링크를 입력해 주세요.');

            btn.disabled = true;
            status.innerText = '영상 분석 중...';

            try {
                const apiEndpoint = currentPlatform === 'tiktok' ? '/api/tiktok' : '/api/insta';
                
                const parseRes = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const parseData = await parseRes.json();
                if (!parseData.success) throw new Error(parseData.message);

                status.innerText = '파일 수신 및 저장 준비 중...';

                // 바이너리 데이터 직접 다운로드 (파일 손상 완벽 방지)
                try {
                    const videoFetch = await fetch(parseData.videoUrl);
                    const blob = await videoFetch.blob();
                    
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = `${currentPlatform}_${Date.now()}.mp4`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);

                    status.innerText = '다운로드가 완료되었습니다!';
                } catch (blobErr) {
                    // 브라우저 직접 수신 실패 시 안전한 원본 직링크 버튼 제공
                    status.innerHTML = `자동 다운로드가 차단되었습니다.<br>아래 버튼을 눌러 원본 영상을 직접 저장하세요.<br><br>
                    <a href="${parseData.videoUrl}" target="_blank" download="${currentPlatform}.mp4" class="direct-link">영상 직접 다운로드 / 보기</a>`;
                }
            } catch (err) {
                status.innerText = '오류 발생: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
