<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f0f0f; color: #fff; margin: 0; }
        .card { background: #1f1f1f; padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #2f2f2f; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .tabs { display: flex; margin-bottom: 20px; gap: 8px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #2f2f2f; color: #888; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: #0095f6; color: #fff; }
        input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 8px; border: 1px solid #3f3f3f; background: #121212; color: #fff; box-sizing: border-box; }
        button.action-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0095f6; color: #fff; font-weight: bold; cursor: pointer; }
        button.action-btn:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 14px; font-size: 14px; color: #aaa; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" id="tiktokTab" onclick="switchPlatform('tiktok')">TikTok</button>
            <button class="tab-btn" id="instaTab" onclick="switchPlatform('insta')">Instagram</button>
        </div>

        <h2 id="title">TikTok Downloader</h2>
        <input type="text" id="urlInput" placeholder="Paste TikTok video link here...">
        <button class="action-btn" id="downloadBtn" onclick="processDownload()">Download Video</button>
        <div id="status"></div>
    </div>

    <script>
        let currentPlatform = 'tiktok';

        function switchPlatform(platform) {
            currentPlatform = platform;
            const tiktokTab = document.getElementById('tiktokTab');
            const instaTab = document.getElementById('instaTab');
            const title = document.getElementById('title');
            const input = document.getElementById('urlInput');

            if (platform === 'tiktok') {
                tiktokTab.classList.add('active');
                instaTab.classList.remove('active');
                title.innerText = 'TikTok Downloader';
                input.placeholder = 'Paste TikTok video link here...';
            } else {
                instaTab.classList.add('active');
                tiktokTab.classList.remove('active');
                title.innerText = 'Instagram Reels Downloader';
                input.placeholder = 'Paste Instagram Reels link here...';
            }
        }

        async function processDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');

            if (!url) return alert('Please enter a valid link.');

            btn.disabled = true;
            status.innerText = 'Analyzing link...';

            try {
                const apiEndpoint = currentPlatform === 'tiktok' ? '/api/tiktok' : '/api/insta';
                
                const parseRes = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const parseData = await parseRes.json();
                if (!parseData.success) throw new Error(parseData.message);

                status.innerText = 'Downloading video file...';

                // 원본 파일 손상 없이 클라이언트에서 직접 저장
                const videoRes = await fetch(parseData.videoUrl);
                const blob = await videoRes.blob();

                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `${currentPlatform}_${Date.now()}.mp4`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);

                status.innerText = 'Download complete! Check your downloads.';
            } catch (err) {
                status.innerText = 'Error: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
