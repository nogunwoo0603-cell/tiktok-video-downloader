<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: #1a1a1a;
            padding: 28px 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #2a2a2a;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }
        .tabs {
            display: flex;
            margin-bottom: 24px;
            gap: 8px;
            background: #111111;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #222222;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #777777;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: #0095f6;
            color: #ffffff;
        }
        h2 {
            margin: 0 0 16px 0;
            font-size: 20px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 10px;
            border: 1px solid #333333;
            background: #111111;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #0095f6;
        }
        button.action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: #0095f6;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button.action-btn:hover {
            background: #0077c5;
        }
        button.action-btn:disabled {
            background: #444444;
            cursor: not-allowed;
        }
        #status {
            margin-top: 16px;
            font-size: 14px;
            color: #aaaaaa;
            line-height: 1.4;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" id="tiktokTab" onclick="switchPlatform('tiktok')">TikTok</button>
            <button class="tab-btn" id="instaTab" onclick="switchPlatform('insta')">Instagram</button>
        </div>

        <h2 id="title">TikTok Downloader</h2>
        <input type="text" id="urlInput" placeholder="틱톡 영상 링크를 입력하세요...">
        <button class="action-btn" id="downloadBtn" onclick="processDownload()">갤러리로 다운로드</button>
        <div id="status"></div>
    </div>

    <script>
        let currentPlatform = 'tiktok';

        function switchPlatform(platform) {
            currentPlatform = platform;
            const tiktokTab = document.getElementById('tiktokTab');
            const instaTab = document.getElementById('instaTab');
            const title = document.getElementById('title');
            const input = document.getElementById('urlInput');
            const status = document.getElementById('status');

            status.innerText = '';

            if (platform === 'tiktok') {
                tiktokTab.classList.add('active');
                instaTab.classList.remove('active');
                title.innerText = 'TikTok Downloader';
                input.placeholder = '틱톡 영상 링크를 입력하세요...';
            } else {
                instaTab.classList.add('active');
                tiktokTab.classList.remove('active');
                title.innerText = 'Instagram Reels Downloader';
                input.placeholder = '인스타그램 릴스 링크를 입력하세요...';
            }
        }

        async function processDownload() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');

            if (!url) {
                alert('올바른 동영상 링크를 입력해주세요.');
                return;
            }

            btn.disabled = true;
            status.innerText = '동영상 분석 중...';

            try {
                const apiEndpoint = currentPlatform === 'tiktok' ? '/api/tiktok' : '/api/insta';
                
                // 1. 영상 링크 분석
                const parseRes = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const parseData = await parseRes.json();
                if (!parseData.success) {
                    throw new Error(parseData.message || '링크 분석 실패');
                }

                status.innerText = '동영상 다운로드 중...';

                // 2. 서버 파이프 다운로드 요청
                const downloadStreamUrl = `/api/download?url=${encodeURIComponent(parseData.videoUrl)}&platform=${currentPlatform}`;
                
                // 모바일 브라우저 다운로드 트리거
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = downloadStreamUrl;
                document.body.appendChild(iframe);

                setTimeout(() => {
                    document.body.removeChild(iframe);
                }, 60000);

                status.innerText = '다운로드가 시작되었습니다. 갤러리 또는 다운로드 폴더를 확인하세요!';
            } catch (err) {
                status.innerText = '에러: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
