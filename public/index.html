<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels Downloader</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #000; color: #fff; margin: 0; }
        .card { background: #121212; padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #262626; }
        input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 8px; border: 1px solid #363636; background: #1a1a1a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0095f6; color: #fff; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; }
        #status { margin-top: 12px; font-size: 14px; color: #a8a8a8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Instagram Reels</h2>
        <input type="text" id="urlInput" placeholder="Paste Instagram Reels link here...">
        <button id="downloadBtn" onclick="processDownload()">Download to Gallery</button>
        <div id="status"></div>
    </div>

    <script>
        async function processDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');

            if (!url) return alert('Please enter a valid link.');

            btn.disabled = true;
            status.innerText = 'Analyzing video...';

            try {
                // 1. 영상 URL 파싱
                const parseRes = await fetch('/api/insta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const parseData = await parseRes.json();
                if (!parseData.success) throw new Error(parseData.message);

                status.innerText = 'Downloading video file...';

                // 2. 바이너리 스트림 파일 수신
                const streamUrl = `/api/stream?videoUrl=${encodeURIComponent(parseData.videoUrl)}`;
                const fileRes = await fetch(streamUrl);
                const blob = await fileRes.blob();

                // 3. 모바일 갤러리/사진 저장용 링크 바인딩
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `reels_${Date.now()}.mp4`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);

                status.innerText = 'Download complete! Check your gallery or downloads.';
            } catch (err) {
                status.innerText = 'Error: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
