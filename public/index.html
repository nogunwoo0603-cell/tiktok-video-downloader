<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokDownloader - TikTok Video Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 2.5rem; border-radius: 20px; width: 100%; max-width: 500px; text-align: center; }
        h1 { margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; }
        .input-group { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
        button { padding: 12px 20px; border-radius: 10px; border: none; background: #6366f1; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #4f46e5; }
        .result-box { display: none; margin-top: 1.5rem; padding: 1.5rem; background: #0f172a; border-radius: 12px; }
        .video-title { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 1rem; word-break: break-all; }
        .download-btn { display: block; width: 100%; padding: 12px 0; background: #10b981; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; text-align: center; }
        .download-btn:hover { background: #059669; }
        #loading { display: none; color: #818cf8; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TokDownloader</h1>
        <p class="subtitle">Download TikTok Videos Without Watermark</p>

        <div class="input-group">
            <input type="text" id="tiktok-url" placeholder="Paste TikTok video link here...">
            <button onclick="downloadVideo()">Analyze</button>
        </div>

        <div id="loading">Analyzing video...</div>

        <div class="result-box" id="result-box">
            <div class="video-title" id="video-title"></div>
            <a href="#" id="dl-link" class="download-btn">Download Video</a>
        </div>
    </div>

    <script>
        async function downloadVideo() {
            const urlInput = document.getElementById('tiktok-url').value.trim();
            const resultBox = document.getElementById('result-box');
            const loading = document.getElementById('loading');
            
            if (!urlInput) {
                alert('Please enter a valid URL.');
                return;
            }

            resultBox.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const result = await response.json();

                if (result && result.data && result.data.play) {
                    let videoUrl = result.data.play;
                    if (!videoUrl.startsWith('http')) {
                        videoUrl = 'https://www.tikwm.com' + videoUrl;
                    }

                    loading.style.display = 'none';
                    document.getElementById('video-title').innerText = result.data.title || 'TikTok Video';
                    
                    const dlBtn = document.getElementById('dl-link');
                    dlBtn.href = `/api/stream?videoUrl=${encodeURIComponent(videoUrl)}`;
                    resultBox.style.display = 'block';
                } else {
                    throw new Error('Failed to analyze TikTok video.');
                }
            } catch (err) {
                loading.style.display = 'none';
                alert(err.message || 'Unable to analyze the video link.');
            }
        }
    </script>
</body>
</html>
